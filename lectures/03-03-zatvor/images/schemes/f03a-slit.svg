    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2b56a"/></marker>
    <marker id="aw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#93a1b3"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#141b24"/>

  <text x="40" y="36" fill="#e2b56a" font-size="20" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">Шторно-щелевой затвор</text>

  <rect x="80" y="80" width="800" height="200" fill="none" stroke="#2a3544" stroke-width="2"/>
  <rect x="80" y="80" width="300" height="200" fill="#0a0e14" opacity="0.92"/>
  <rect x="460" y="80" width="420" height="200" fill="#0a0e14" opacity="0.92"/>
  <rect x="380" y="80" width="80" height="200" fill="#e2b56a"/>
  <text x="420" y="190" fill="#141b24" font-size="16" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">щель</text>

  <text x="200" y="190" fill="#93a1b3" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">первая шторка</text>

  <text x="680" y="190" fill="#93a1b3" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">вторая шторка</text>


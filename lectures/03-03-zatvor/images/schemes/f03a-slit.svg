  <text x="480" y="350" fill="#6ec3d8" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">направление пробега</text>

  <text x="40" y="380" fill="#93a1b3" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">выдержка точки = ширина щели / скорость · пробег кадра длится дольше</text>



<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340">
  <defs>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ec3d8"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2b56a"/></marker>
    <marker id="aw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#93a1b3"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#141b24"/>

  <text x="40" y="36" fill="#e2b56a" font-size="20" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">Динамический диапазон</text>

  <defs>
    <linearGradient id="dr" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.5" stop-color="#6ec3d8"/>
      <stop offset="1" stop-color="#f4f0e6"/>
    </linearGradient>
  </defs>
  <rect x="80" y="100" width="800" height="80" fill="url(#dr)"/>
  <text x="90" y="220" fill="#93a1b3" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">шум в тенях</text>

  <text x="400" y="220" fill="#e9eef4" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">рабочий диапазон</text>

  <text x="720" y="220" fill="#e2b56a" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">клиппинг светов</text>

  <text x="40" y="290" fill="#93a1b3" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">снизу ограничивает темновой ток · сверху — насыщение ячейки</text>


</svg>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Черновики схем Ф03б</title>
  <style>
    body { margin: 0; background: #10151c; color: #e9eef4; font-family: Segoe UI, sans-serif; }
    header { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,.1); }
    h1 { margin: 0; font-size: 20px; }
    p { color: #93a1b3; margin: 6px 0 0; }
    main { display: grid; gap: 28px; padding: 24px; max-width: 1100px; margin: 0 auto; }
    figure { margin: 0; }
    img { width: 100%; border-radius: 10px; background: #000; display: block; }
    figcaption { margin-top: 8px; color: #93a1b3; font-size: 14px; }
    code { color: #e2b56a; }
  </style>
</head>
<body>
  <header>
    <h1>Черновики схем · Ф03б</h1>
    <p>Не в слайдах. Папка <code>images/_draft_schemes/</code></p>
  </header>
  <main>
    <figure>
      <img src="f03b-bayer.svg" alt="Фильтр Байера">
      <figcaption>Фильтр Байера · <code>f03b-bayer.svg</code></figcaption>
    </figure>
    <figure>
      <img src="f03b-triangle.svg" alt="Треугольник экспозиции">
      <figcaption>Треугольник экспозиции · <code>f03b-triangle.svg</code></figcaption>
    </figure>
    <figure>
      <img src="f03b-snr-pixel.svg" alt="Пиксель и SNR">
      <figcaption>Пиксель и SNR · <code>f03b-snr-pixel.svg</code></figcaption>
    </figure>
    <figure>
      <img src="f03b-dynamic-range.svg" alt="Динамический диапазон">
      <figcaption>Динамический диапазон · <code>f03b-dynamic-range.svg</code></figcaption>
    </figure>
  </main>
</body>
</html>

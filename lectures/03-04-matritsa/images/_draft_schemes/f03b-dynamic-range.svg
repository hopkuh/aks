<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <rect width="100%" height="100%" fill="#141b24"/>

  <text x="40" y="36" fill="#e2b56a" font-size="18" font-family="Segoe UI, sans-serif">Динамический диапазон</text>
  <defs>
    <linearGradient id="dr" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.45" stop-color="#6ec3d8"/>
      <stop offset="1" stop-color="#f4f0e6"/>
    </linearGradient>
  </defs>
  <rect x="80" y="100" width="740" height="70" fill="url(#dr)"/>
  <text x="90" y="210" fill="#93a1b3" font-size="14" font-family="Segoe UI, sans-serif">шум в тенях</text>
  <text x="360" y="210" fill="#e9eef4" font-size="14" font-family="Segoe UI, sans-serif">рабочий диапазон</text>
  <text x="680" y="210" fill="#e2b56a" font-size="14" font-family="Segoe UI, sans-serif">клиппинг светов</text>
  <text x="80" y="280" fill="#93a1b3" font-size="14" font-family="Segoe UI, sans-serif">на КМОП пересвет необратимее дыр в тенях</text>

</svg>

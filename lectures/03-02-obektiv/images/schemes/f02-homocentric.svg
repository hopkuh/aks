<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420">
  <rect width="100%" height="100%" fill="#141b24"/>
  <text x="40" y="34" fill="#e2b56a" font-size="20" font-family="Segoe UI, sans-serif" font-weight="600">Гомоцентрический пучок и аберрации</text>
  <text x="270" y="68" fill="#86c99a" font-size="16" font-family="Segoe UI, sans-serif" text-anchor="middle" font-weight="600">гомоцентрический</text>
  <text x="270" y="90" fill="#93a1b3" font-size="13" font-family="Segoe UI, sans-serif" text-anchor="middle">лучи из одной точки снова сходятся в одну точку</text>
  <line x1="40" y1="230" x2="500" y2="230" stroke="#2a3544"/>
  <circle cx="70" cy="230" r="6" fill="#e2b56a"/>
  <ellipse cx="250" cy="230" rx="16" ry="78" fill="#141b24" stroke="#6ec3d8" stroke-width="3"/>
  <line x1="70" y1="230" x2="250" y2="168" stroke="#86c99a" stroke-width="1.8"/>
  <line x1="70" y1="230" x2="250" y2="200" stroke="#86c99a" stroke-width="1.8"/>
  <line x1="70" y1="230" x2="250" y2="230" stroke="#e2b56a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="70" y1="230" x2="250" y2="260" stroke="#86c99a" stroke-width="1.8"/>
  <line x1="70" y1="230" x2="250" y2="292" stroke="#86c99a" stroke-width="1.8"/>
  <line x1="250" y1="168" x2="460" y2="230" stroke="#86c99a" stroke-width="1.8"/>
  <line x1="250" y1="200" x2="460" y2="230" stroke="#86c99a" stroke-width="1.8"/>
  <line x1="250" y1="230" x2="460" y2="230" stroke="#e2b56a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="250" y1="260" x2="460" y2="230" stroke="#86c99a" stroke-width="1.8"/>
  <line x1="250" y1="292" x2="460" y2="230" stroke="#86c99a" stroke-width="1.8"/>
  <circle cx="460" cy="230" r="6" fill="#86c99a"/>
  <text x="270" y="380" fill="#86c99a" font-size="14" font-family="Segoe UI, sans-serif" text-anchor="middle">точка становится точкой</text>
  <text x="830" y="68" fill="#e07a73" font-size="16" font-family="Segoe UI, sans-serif" text-anchor="middle" font-weight="600">не гомоцентрический</text>
  <text x="830" y="90" fill="#93a1b3" font-size="13" font-family="Segoe UI, sans-serif" text-anchor="middle">краевые и центральные лучи не встречаются в одном месте</text>
  <line x1="560" y1="230" x2="1060" y2="230" stroke="#2a3544"/>
  <circle cx="590" cy="230" r="6" fill="#e2b56a"/>
  <ellipse cx="770" cy="230" rx="16" ry="78" fill="#141b24" stroke="#6ec3d8" stroke-width="3"/>
  <line x1="590" y1="230" x2="770" y2="160" stroke="#e07a73" stroke-width="1.8"/>
  <line x1="590" y1="230" x2="770" y2="198" stroke="#e2b56a" stroke-width="1.8"/>
  <line x1="590" y1="230" x2="770" y2="230" stroke="#93a1b3" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="590" y1="230" x2="770" y2="262" stroke="#e2b56a" stroke-width="1.8"/>
  <line x1="590" y1="230" x2="770" y2="300" stroke="#e07a73" stroke-width="1.8"/>
  <line x1="770" y1="160" x2="920" y2="248" stroke="#e07a73" stroke-width="1.8"/>
  <line x1="770" y1="198" x2="980" y2="218" stroke="#e2b56a" stroke-width="1.8"/>
  <line x1="770" y1="230" x2="1000" y2="230" stroke="#93a1b3" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="770" y1="262" x2="980" y2="242" stroke="#e2b56a" stroke-width="1.8"/>
  <line x1="770" y1="300" x2="920" y2="212" stroke="#e07a73" stroke-width="1.8"/>
  <ellipse cx="955" cy="230" rx="42" ry="28" fill="none" stroke="#e07a73" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="830" y="380" fill="#e07a73" font-size="14" font-family="Segoe UI, sans-serif" text-anchor="middle">точка становится пятном (аберрации)</text>

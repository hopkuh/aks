    <marker id="aw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#93a1b3"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#141b24"/>

  <text x="40" y="36" fill="#e2b56a" font-size="20" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">Глубина резко изображаемого пространства</text>

  <rect x="50" y="150" width="28" height="140" fill="#6ec3d8"/>
  <text x="64" y="320" fill="#6ec3d8" font-size="12" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">камера</text>

  <line x1="78" y1="220" x2="920" y2="220" stroke="#2a3544" stroke-width="2"/>
  <line x1="280" y1="100" x2="280" y2="300" stroke="#e2b56a" stroke-dasharray="5 4"/>
  <text x="280" y="90" fill="#e2b56a" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">H / 2</text>

  <line x1="500" y1="80" x2="500" y2="300" stroke="#e2b56a" stroke-width="2"/>
  <text x="500" y="70" fill="#e2b56a" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">гиперфокальное расстояние H</text>

  <path d="M280,220 Q500,150 900,220" fill="none" stroke="#6ec3d8" stroke-width="3"/>
  <circle cx="500" cy="220" r="6" fill="#e2b56a"/>
  <text x="500" y="340" fill="#e9eef4" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">плоскость наводки</text>

  <text x="40" y="400" fill="#93a1b3" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">H ≈ f² / (n₀ · z) · z — допустимый кружок нерезкости · резко от H/2 до ∞</text>



<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <defs>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ec3d8"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2b56a"/></marker>
    <marker id="aw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#93a1b3"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#141b24"/>

  <text x="40" y="36" fill="#e2b56a" font-size="20" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">Тонкая линза</text>

  <text x="280" y="36" fill="#6ec3d8" font-size="18" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">1/a + 1/a′ = 1/f</text>

  <line x1="40" y1="240" x2="920" y2="240" stroke="#2a3544" stroke-width="2"/>
  <text x="900" y="232" fill="#93a1b3" font-size="12" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="end">оптическая ось</text>

  <path d="M470,110 L510,240 L470,370" fill="none" stroke="#6ec3d8" stroke-width="3"/>
  <path d="M510,110 L470,240 L510,370" fill="none" stroke="#6ec3d8" stroke-width="3"/>
  <text x="490" y="98" fill="#6ec3d8" font-size="13" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">линза</text>

  <circle cx="160" cy="160" r="8" fill="#e2b56a"/>
  <text x="160" y="144" fill="#e2b56a" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">предмет</text>

  <path d="M168,160 L490,240" stroke="#e2b56a" fill="none"/>
  <path d="M168,160 L490,160 L800,320" stroke="#6ec3d8" fill="none"/>
  <path d="M168,160 L490,200 L800,320" stroke="#93a1b3" fill="none"/>
  <circle cx="800" cy="320" r="8" fill="#6ec3d8"/>
  <text x="800" y="350" fill="#6ec3d8" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">изображение</text>

  <circle cx="400" cy="240" r="5" fill="#e9eef4"/>
  <circle cx="580" cy="240" r="5" fill="#e9eef4"/>
  <text x="400" y="268" fill="#e9eef4" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">F</text>

  <text x="580" y="268" fill="#e9eef4" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">F′</text>

  <line x1="160" y1="400" x2="490" y2="400" stroke="#e2b56a" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="490" y1="400" x2="800" y2="400" stroke="#6ec3d8" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="325" y="428" fill="#e2b56a" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">a — до предмета</text>

  <text x="645" y="428" fill="#6ec3d8" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">a′ — до изображения</text>



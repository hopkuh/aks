<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <rect width="100%" height="100%" fill="#141b24"/>
  <text x="40" y="34" fill="#e2b56a" font-size="20" font-family="Segoe UI, sans-serif" font-weight="600">Кружок нерезкости</text>
  <text x="40" y="64" fill="#6ec3d8" font-size="14" font-family="Segoe UI, sans-serif" >диафрагма открыта</text>
  <line x1="60" y1="160" x2="1040" y2="160" stroke="#e2b56a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="80" cy="160" r="5" fill="#e2b56a"/>
  <text x="80" y="198" fill="#e2b56a" font-size="13" font-family="Segoe UI, sans-serif" text-anchor="middle">точечный объект</text>
  <text x="80" y="216" fill="#93a1b3" font-size="12" font-family="Segoe UI, sans-serif" text-anchor="middle">вне плоскости наводки</text>
  <ellipse cx="420" cy="160" rx="18" ry="70" fill="#141b24" stroke="#e2b56a" stroke-width="3"/>
  <rect x="400" y="78" width="40" height="14" rx="2" fill="#2a3544" stroke="#6ec3d8"/>
  <rect x="400" y="228" width="40" height="14" rx="2" fill="#2a3544" stroke="#6ec3d8"/>
  <text x="420" y="68" fill="#6ec3d8" font-size="12" font-family="Segoe UI, sans-serif" text-anchor="middle">K мало</text>
  <line x1="80" y1="160" x2="420" y2="92" stroke="#6ec3d8" stroke-width="1.8"/>
  <line x1="80" y1="160" x2="420" y2="228" stroke="#6ec3d8" stroke-width="1.8"/>
  <line x1="420" y1="92" x2="980" y2="160" stroke="#6ec3d8" stroke-width="1.8"/>
  <line x1="420" y1="228" x2="980" y2="160" stroke="#6ec3d8" stroke-width="1.8"/>
  <rect x="778" y="78" width="10" height="164" fill="#3a4a58" stroke="#6ec3d8"/>
  <text x="783" y="68" fill="#6ec3d8" font-size="12" font-family="Segoe UI, sans-serif" text-anchor="middle">плоскость датчика</text>
  <ellipse cx="783" cy="160" rx="6" ry="36" fill="none" stroke="#e2b56a" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="860" y="122" fill="#e2b56a" font-size="14" font-family="Segoe UI, sans-serif" >кружок нерезкости c</text>
  <circle cx="980" cy="160" r="4" fill="#6ec3d8"/>
  <text x="40" y="300" fill="#6ec3d8" font-size="14" font-family="Segoe UI, sans-serif" >диафрагма закрыта</text>
  <line x1="60" y1="400" x2="1040" y2="400" stroke="#e2b56a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="80" cy="400" r="5" fill="#e2b56a"/>
  <text x="80" y="438" fill="#e2b56a" font-size="13" font-family="Segoe UI, sans-serif" text-anchor="middle">тот же объект</text>
  <ellipse cx="420" cy="400" rx="18" ry="70" fill="#141b24" stroke="#e2b56a" stroke-width="3"/>
  <rect x="400" y="318" width="40" height="52" rx="2" fill="#2a3544" stroke="#6ec3d8"/>
  <rect x="400" y="430" width="40" height="52" rx="2" fill="#2a3544" stroke="#6ec3d8"/>
  <text x="420" y="308" fill="#6ec3d8" font-size="12" font-family="Segoe UI, sans-serif" text-anchor="middle">K больше, пучок уже</text>
  <line x1="80" y1="400" x2="420" y2="372" stroke="#6ec3d8" stroke-width="1.8"/>
  <line x1="80" y1="400" x2="420" y2="428" stroke="#6ec3d8" stroke-width="1.8"/>
  <line x1="420" y1="372" x2="980" y2="400" stroke="#6ec3d8" stroke-width="1.8"/>
  <line x1="420" y1="428" x2="980" y2="400" stroke="#6ec3d8" stroke-width="1.8"/>
  <rect x="778" y="318" width="10" height="164" fill="#3a4a58" stroke="#6ec3d8"/>
  <ellipse cx="783" cy="400" rx="5" ry="12" fill="none" stroke="#86c99a" stroke-width="2"/>
  <text x="860" y="372" fill="#86c99a" font-size="14" font-family="Segoe UI, sans-serif" >кружок меньше</text>
  <text x="860" y="392" fill="#93a1b3" font-size="13" font-family="Segoe UI, sans-serif" >если c меньше допустимого — кажется резким</text>
  <circle cx="980" cy="400" r="4" fill="#6ec3d8"/>
  <rect x="40" y="500" width="1020" height="40" rx="8" fill="none" stroke="#e2b56a"/>
  <text x="550" y="526" fill="#e2b56a" font-size="16" font-family="Segoe UI, sans-serif" text-anchor="middle">Абсолютно резка только плоскость наводки</text>
</svg>

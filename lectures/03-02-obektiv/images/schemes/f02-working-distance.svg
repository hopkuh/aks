<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <defs>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ec3d8"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2b56a"/></marker>
    <marker id="aw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#93a1b3"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#141b24"/>

  <text x="40" y="36" fill="#e2b56a" font-size="20" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">Рабочий отрезок ≠ фокусное</text>

  <rect x="80" y="90" width="220" height="120" rx="8" fill="none" stroke="#6ec3d8" stroke-width="2"/>
  <text x="190" y="160" fill="#6ec3d8" font-size="15" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">оправа</text>

  <line x1="300" y1="150" x2="700" y2="150" stroke="#2a3544" stroke-width="2"/>
  <line x1="300" y1="90" x2="300" y2="210" stroke="#e2b56a" stroke-width="2"/>
  <text x="300" y="80" fill="#e2b56a" font-size="13" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">опорный торец</text>

  <rect x="680" y="110" width="160" height="80" fill="none" stroke="#e9eef4" stroke-width="2"/>
  <text x="760" y="155" fill="#e9eef4" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">матрица</text>

  <line x1="300" y1="250" x2="680" y2="250" stroke="#e2b56a" marker-end="url(#ag)"/>
  <text x="490" y="280" fill="#e2b56a" font-size="15" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">рабочий отрезок</text>


</svg>

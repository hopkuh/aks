<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Черновики схем Ф01</title>
  <style>
    body { margin: 0; background: #10151c; color: #e9eef4; font-family: Segoe UI, sans-serif; }
    header { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,.1); }
    h1 { margin: 0; font-size: 20px; }
    p { color: #93a1b3; margin: 6px 0 0; }
    main { display: grid; gap: 28px; padding: 24px; max-width: 1100px; margin: 0 auto; }
    figure { margin: 0; }
    img { width: 100%; border-radius: 10px; background: #000; display: block; }
    figcaption { margin-top: 8px; color: #93a1b3; font-size: 14px; }
    code { color: #e2b56a; }
  </style>
</head>
<body>
  <header>
    <h1>Черновики схем · Ф01</h1>
    <p>Не в слайдах. Папка <code>images/_draft_schemes/</code></p>
  </header>
  <main>
    <figure>
      <img src="f01-dzz-cycle.png" alt="Цикл ДЗЗ">
      <figcaption>ДЗЗ · <code>f01-dzz-cycle.png</code></figcaption>
    </figure>
    <figure>
      <img src="f01-camera-obscura.png" alt="Камера-обскура">
      <figcaption>Камера-обскура · <code>f01-camera-obscura.png</code></figcaption>
    </figure>
    <figure>
      <img src="f01-daguerre-calotype.png" alt="Дагерротипия и калотипия">
      <figcaption>Дагер / Тальбот · <code>f01-daguerre-calotype.png</code></figcaption>
    </figure>
    <figure>
      <img src="f01-ccd-cmos.png" alt="ПЗС и КМОП">
      <figcaption>ПЗС / КМОП · <code>f01-ccd-cmos.png</code></figcaption>
    </figure>
    <figure>
      <img src="f01-crop-factor.png" alt="Кроп-фактор">
      <figcaption>Кроп-фактор · <code>f01-crop-factor.png</code></figcaption>
    </figure>
    <figure>
      <img src="f01-sensor-sizes.png" alt="Размеры матриц">
      <figcaption>Размеры матриц · <code>f01-sensor-sizes.png</code></figcaption>
    </figure>
    <figure>
      <img src="f01-camera-pipeline.png" alt="Схема фотоаппарата">
      <figcaption>Цепочка камеры · <code>f01-camera-pipeline.png</code></figcaption>
    </figure>
    <figure>
      <img src="f01-pasm.png" alt="Режимы PASM">
      <figcaption>PASM · <code>f01-pasm.png</code></figcaption>
    </figure>
    <figure>
      <img src="f01-gost-formats.png" alt="Формат кадра ГОСТ">
      <figcaption>ГОСТ 25205 · <code>f01-gost-formats.png</code></figcaption>
    </figure>
  </main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#141b24"/>
  <text x="40" y="36" fill="#e2b56a" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Продольное перекрытие кадров</text>

  <!-- БВС -->
  <g transform="translate(400 78)">
    <rect x="-28" y="-10" width="56" height="20" rx="4" fill="#3a4a58" stroke="#e2b56a" stroke-width="2"/>
    <circle cx="-36" cy="-18" r="10" fill="none" stroke="#93a1b3" stroke-width="2"/>
    <circle cx="36" cy="-18" r="10" fill="none" stroke="#93a1b3" stroke-width="2"/>
    <circle cx="-36" cy="18" r="10" fill="none" stroke="#93a1b3" stroke-width="2"/>
    <circle cx="36" cy="18" r="10" fill="none" stroke="#93a1b3" stroke-width="2"/>
    <line x1="-28" y1="-8" x2="-36" y2="-12" stroke="#93a1b3" stroke-width="2"/>
    <line x1="28" y1="-8" x2="36" y2="-12" stroke="#93a1b3" stroke-width="2"/>
    <line x1="-28" y1="8" x2="-36" y2="12" stroke="#93a1b3" stroke-width="2"/>
    <line x1="28" y1="8" x2="36" y2="12" stroke="#93a1b3" stroke-width="2"/>
    <circle r="4" fill="#e2b56a"/>
  </g>
  <text x="400" y="54" fill="#e2b56a" font-size="14" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">БВС</text>
  <line x1="400" y1="108" x2="400" y2="268" stroke="#e2b56a" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- Поля зрения -->
  <line x1="400" y1="98" x2="120" y2="280" stroke="#6ec3d8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="400" y1="98" x2="520" y2="280" stroke="#6ec3d8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="400" y1="98" x2="280" y2="280" stroke="#e2b56a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="400" y1="98" x2="680" y2="280" stroke="#e2b56a" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- Следы кадров на местности, вид сверху. Px = 60%: сдвиг = 0,4 ширины -->
  <rect x="120" y="280" width="400" height="140" fill="#6ec3d8" opacity="0.22" stroke="#6ec3d8" stroke-width="2"/>
  <rect x="280" y="280" width="400" height="140" fill="#e2b56a" opacity="0.22" stroke="#e2b56a" stroke-width="2"/>
  <rect x="280" y="280" width="240" height="140" fill="#86c99a" opacity="0.55" stroke="#86c99a" stroke-width="2"/>

  <text x="180" y="358" fill="#6ec3d8" font-size="16" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700">кадр 1</text>
  <text x="620" y="358" fill="#e2b56a" font-size="16" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700">кадр 2</text>
  <text x="400" y="348" fill="#141b24" font-size="16" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700">перекрытие</text>
  <text x="400" y="370" fill="#141b24" font-size="15" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Px ≈ 60%</text>

  <line x1="80" y1="440" x2="880" y2="440" stroke="#93a1b3" stroke-width="2"/>
  <text x="80" y="468" fill="#93a1b3" font-size="14" font-family="Segoe UI, Arial, sans-serif">местность · вид сверху</text>
  <text x="80" y="508" fill="#93a1b3" font-size="15" font-family="Segoe UI, Arial, sans-serif">Общая полоса двух соседних кадров — стереопара. Px — доля перекрытия вдоль маршрута.</text>
</svg>

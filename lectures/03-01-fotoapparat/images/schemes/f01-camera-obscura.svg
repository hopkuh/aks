<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520">
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2b56a"/>
    </marker>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ec3d8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#141b24"/>
  <text x="40" y="34" fill="#e2b56a" font-size="20" font-family="Segoe UI, sans-serif" font-weight="600">Камера-обскура · подобные треугольники</text>

  <!-- object upright, tip A y=120, base B y=360, hole O (475, 240)
       d=315, d'=430, k=d'/d≈1.365
       A' y = 240 + 120*k ≈ 404; B' y = 240 - 120*k ≈ 76 -->
  <line x1="160" y1="120" x2="160" y2="360" stroke="#6ec3d8" stroke-width="6"/>
  <polygon points="160,96 146,130 174,130" fill="#6ec3d8"/>
  <circle cx="160" cy="120" r="5" fill="#e2b56a"/>
  <circle cx="160" cy="360" r="5" fill="#e2b56a"/>
  <text x="78" y="124" fill="#6ec3d8" font-size="16">A</text>
  <text x="78" y="366" fill="#6ec3d8" font-size="16">B</text>
  <text x="70" y="248" fill="#93a1b3" font-size="14">h</text>

  <rect x="468" y="56" width="14" height="400" fill="#2a3544"/>
  <circle cx="475" cy="240" r="9" fill="#141b24" stroke="#e2b56a" stroke-width="3"/>
  <text x="475" y="48" fill="#e2b56a" font-size="16" text-anchor="middle">O</text>
  <text x="458" y="228" fill="#e2b56a" font-size="13" text-anchor="end">отверстие</text>

  <rect x="900" y="56" width="10" height="400" fill="#3a4a58"/>

  <line x1="905" y1="76" x2="905" y2="404" stroke="#e2b56a" stroke-width="6"/>
  <polygon points="905,428 891,396 919,396" fill="#e2b56a"/>
  <circle cx="905" cy="404" r="5" fill="#6ec3d8"/>
  <circle cx="905" cy="76" r="5" fill="#6ec3d8"/>
  <text x="930" y="410" fill="#e2b56a" font-size="16">A′</text>
  <text x="930" y="82" fill="#e2b56a" font-size="16">B′</text>
  <text x="930" y="248" fill="#93a1b3" font-size="14">h′</text>

  <line x1="160" y1="120" x2="475" y2="240" stroke="#e2b56a" stroke-width="1.8"/>
  <line x1="475" y1="240" x2="905" y2="404" stroke="#e2b56a" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="160" y1="360" x2="475" y2="240" stroke="#6ec3d8" stroke-width="1.8"/>
  <line x1="475" y1="240" x2="905" y2="76" stroke="#6ec3d8" stroke-width="1.8" marker-end="url(#ac)"/>

  <line x1="160" y1="470" x2="475" y2="470" stroke="#93a1b3"/>
  <text x="318" y="492" fill="#93a1b3" font-size="14" text-anchor="middle">d</text>
  <line x1="475" y1="470" x2="905" y2="470" stroke="#93a1b3"/>
  <text x="690" y="492" fill="#93a1b3" font-size="14" text-anchor="middle">d′</text>
  <text x="40" y="514" fill="#93a1b3" font-size="15" font-family="Consolas, monospace">h / d = h′ / d′ · луч AO продолжается в OA′ · изображение перевёрнуто</text>
</svg>

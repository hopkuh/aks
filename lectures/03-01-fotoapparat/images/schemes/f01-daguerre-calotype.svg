  </defs>
  <rect width="100%" height="100%" fill="#141b24"/>

  <text x="40" y="36" fill="#e2b56a" font-size="20" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="start">Два пути фиксации</text>

  <rect x="50" y="70" width="400" height="280" rx="12" fill="none" stroke="#e2b56a" stroke-width="2"/>

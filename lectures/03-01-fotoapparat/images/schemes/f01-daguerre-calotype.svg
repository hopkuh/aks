  <text x="710" y="150" fill="#e9eef4" font-size="15" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">негатив на бумаге</text>

  <rect x="560" y="180" width="100" height="70" fill="#2a3544" stroke="#6ec3d8"/>
  <text x="610" y="220" fill="#6ec3d8" font-size="22" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">−</text>

  <line x1="660" y1="215" x2="710" y2="215" stroke="#6ec3d8" marker-end="url(#ac)"/>
  <rect x="720" y="170" width="70" height="50" fill="#2a3544" stroke="#e2b56a"/>

  <text x="250" y="150" fill="#e9eef4" font-size="15" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">одна пластина</text>

  <rect x="170" y="180" width="160" height="90" fill="#2a3544" stroke="#e2b56a"/>
  <text x="250" y="232" fill="#e2b56a" font-size="14" font-family="Segoe UI, PT Sans, sans-serif" font-weight="600" text-anchor="middle">единственный</text>


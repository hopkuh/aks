<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Segoe UI, PT Sans, sans-serif">
  <rect width="960" height="360" fill="#141b24"/>
  <text x="480" y="32" text-anchor="middle" fill="#e8e4dc" font-size="18">Число спектральных каналов, не «цветность картинки»</text>

  <!-- Одноканальные -->
  <g transform="translate(28,56)">
    <rect width="288" height="278" rx="12" fill="#0e141c" stroke="#2a3544"/>
    <text x="144" y="32" text-anchor="middle" fill="#e2b56a" font-size="17" font-weight="700">Одноканальные</text>
    <text x="144" y="56" text-anchor="middle" fill="#9aa8b8" font-size="13">один канал яркости</text>
    <rect x="36" y="78" width="216" height="36" rx="4" fill="#8a9bb0"/>
    <text x="144" y="102" text-anchor="middle" fill="#141b24" font-size="13">панхром · весь видимый</text>
    <text x="144" y="148" text-anchor="middle" fill="#e8e4dc" font-size="13">Один широкий канал,</text>
    <text x="144" y="168" text-anchor="middle" fill="#e8e4dc" font-size="13">часто 380–780 нм.</text>
    <text x="144" y="198" text-anchor="middle" fill="#9aa8b8" font-size="13">Геометрия обычно острее:</text>
    <text x="144" y="218" text-anchor="middle" fill="#9aa8b8" font-size="13">вся энергия в один приёмник.</text>
  </g>

  <!-- Мультиспектральные -->
  <g transform="translate(336,56)">
    <rect width="288" height="278" rx="12" fill="#0e141c" stroke="#2a3544"/>
    <text x="144" y="32" text-anchor="middle" fill="#e2b56a" font-size="17" font-weight="700">Мультиспектральные</text>
    <text x="144" y="56" text-anchor="middle" fill="#9aa8b8" font-size="13">несколько каналов, типично 3–10</text>
    <rect x="28" y="78" width="48" height="36" rx="3" fill="#3d6ec9"/>
    <rect x="82" y="78" width="48" height="36" rx="3" fill="#3d9a4a"/>
    <rect x="136" y="78" width="48" height="36" rx="3" fill="#c44c3a"/>
    <rect x="190" y="78" width="70" height="36" rx="3" fill="#8b2a2a"/>
    <text x="52" y="102" text-anchor="middle" fill="#fff" font-size="12">B</text>
    <text x="106" y="102" text-anchor="middle" fill="#fff" font-size="12">G</text>
    <text x="160" y="102" text-anchor="middle" fill="#fff" font-size="12">R</text>
    <text x="225" y="102" text-anchor="middle" fill="#fff" font-size="12">NIR</text>
    <text x="144" y="148" text-anchor="middle" fill="#e8e4dc" font-size="13">RGB, RGB + ближний ИК</text>
    <text x="144" y="168" text-anchor="middle" fill="#e8e4dc" font-size="13">и другие узкие окна.</text>
    <text x="144" y="198" text-anchor="middle" fill="#9aa8b8" font-size="13">Дешифрирование, индексы</text>
    <text x="144" y="218" text-anchor="middle" fill="#9aa8b8" font-size="13">(NDVI). n = n(λ) по каналам.</text>
  </g>

  <!-- Гиперспектральные -->
  <g transform="translate(644,56)">
    <rect width="288" height="278" rx="12" fill="#0e141c" stroke="#2a3544"/>
    <text x="144" y="32" text-anchor="middle" fill="#e2b56a" font-size="17" font-weight="700">Гиперспектральные</text>
    <text x="144" y="56" text-anchor="middle" fill="#9aa8b8" font-size="13">сотни узких каналов, ориентир &gt; 100</text>
    <g transform="translate(28,78)">
      <rect x="0" y="0" width="8" height="36" fill="#2a3a8a"/>
      <rect x="10" y="0" width="8" height="36" fill="#2e4aa0"/>
      <rect x="20" y="0" width="8" height="36" fill="#3260b0"/>
      <rect x="30" y="0" width="8" height="36" fill="#2e78a8"/>
      <rect x="40" y="0" width="8" height="36" fill="#2a9080"/>
      <rect x="50" y="0" width="8" height="36" fill="#2a9a50"/>
      <rect x="60" y="0" width="8" height="36" fill="#4aa030"/>
      <rect x="70" y="0" width="8" height="36" fill="#7aa020"/>
      <rect x="80" y="0" width="8" height="36" fill="#b0a018"/>
      <rect x="90" y="0" width="8" height="36" fill="#c08020"/>
      <rect x="100" y="0" width="8" height="36" fill="#c06028"/>
      <rect x="110" y="0" width="8" height="36" fill="#b04030"/>
      <rect x="120" y="0" width="8" height="36" fill="#982838"/>
      <rect x="130" y="0" width="8" height="36" fill="#7a2038"/>
      <rect x="140" y="0" width="8" height="36" fill="#6a1830"/>
      <rect x="150" y="0" width="8" height="36" fill="#581428"/>
      <rect x="160" y="0" width="8" height="36" fill="#481020"/>
      <rect x="170" y="0" width="8" height="36" fill="#3a0e18"/>
      <rect x="180" y="0" width="8" height="36" fill="#2e0c14"/>
      <rect x="190" y="0" width="8" height="36" fill="#240a10"/>
      <rect x="200" y="0" width="8" height="36" fill="#1a080c"/>
      <rect x="210" y="0" width="8" height="36" fill="#14060a"/>
      <rect x="220" y="0" width="8" height="36" fill="#100508"/>
    </g>
    <text x="144" y="148" text-anchor="middle" fill="#e8e4dc" font-size="13">Непрерывный спектр,</text>
    <text x="144" y="168" text-anchor="middle" fill="#e8e4dc" font-size="13">сигнатура вещества.</text>
    <text x="144" y="198" text-anchor="middle" fill="#9aa8b8" font-size="13">Не «ещё один RGB».</text>
    <text x="144" y="218" text-anchor="middle" fill="#9aa8b8" font-size="13">На топоплан 1:2000 не обязателен.</text>
  </g>
</svg>
